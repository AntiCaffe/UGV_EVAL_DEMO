pcdet:
  ros__parameters:
    config_file: "cfgs/kitti_models/pointrcnn.yaml"
    model_file: "checkpoints/pointrcnn_7870.pth"
    allow_memory_fractioning: False
    allow_score_thresholding: True
    num_features: 4
    device_id: 0
    device_memory_fraction: 6.0
    threshold_array: [0.5, 0.3, 0.5] # [Car, Pedestrian, Bicycle]