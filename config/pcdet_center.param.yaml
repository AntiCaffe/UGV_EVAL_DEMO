pcdet:
  ros__parameters:

    # custom 1
    # config_file: "cfgs/kitti_models/pv_rcnn.yaml"
    # model_file: "checkpoints/pv_rcnn_8369.pth"

    # # custom 09/23
    # config_file: "cfgs/kitti_models/second_custom_250.yaml"
    # model_file: "checkpoints/second_custom_250.pth"

    # custom 09/30
    # config_file: "cfgs/kitti_models/second_custom_300.yaml"
    # model_file: "checkpoints/second_custom_300.pth"

    # custom 10/04
    # config_file: "cfgs/kitti_models/second_custom_1004.yaml"
    # model_file: "checkpoints/second_custom_1004.pth"

    # custom 10/04
    # config_file: "cfgs/kitti_models/pv_rcnn.yaml"
    # model_file: "checkpoints/pv_rcnn_8369.pth"
    
    # SECOND 모델로 복구 (원래 안정적인 모델)
    config_file: "cfgs/kitti_models/centerpoint_aug.yaml"
    model_file: "checkpoints/checkpoint_epoch_80.pth"

    allow_memory_fractioning: False
    allow_score_thresholding: True
    num_features: 4
    device_id: 0
    device_memory_fraction: 6.0
    # ByteTrack high-score/new-track threshold: [Car, Pedestrian, Cyclist]
    # 이보다 낮고 tracker_low_score_threshold 이상인 검출은 2차 association에만 사용
    threshold_array: [0.5, 0.3, 0.4]
    tracker_frame_rate: 10.0
    tracker_low_score_threshold: 0.1
    tracker_match_threshold: 0.95
    tracker_second_match_threshold: 0.98
    tracker_unconfirmed_match_threshold: 0.90
    tracker_max_lost_sec: 1.0
    tracker_mahalanobis_gate: 16.27
    tracker_lost_velocity_decay: 0.95
