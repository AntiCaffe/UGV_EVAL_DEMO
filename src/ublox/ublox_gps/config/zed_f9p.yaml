# Configuration Settings for C94-M8P device
ublox_gps_node:
  ros__parameters:
    debug: 0                    # Range 0-4 (0 means no debug statements will print)
    device: /dev/ttyACM0
    frame_id: gps
    rate: 10.0                  # Measurement/navigation rate [Hz]
    nav_rate: 1                 # Navigation solution every measurement cycle
    uart1:
      baudrate: 9600
    dynamic_model: portable
    fix_mode: auto
    dgnss_mode: 3               # Prefer RTK fixed mode when RTCM corrections are available

    # TMODE3 Config
    tmode3: 0                   # Rover mode; disable Survey-In for moving calibration
    sv_in:
      reset: false              # True: disables and re-enables survey-in (resets)
                                # False: Disables survey-in only if TMODE3 is
                                # disabled
      min_dur: 300              # Survey-In Minimum Duration [s]
      acc_lim: 3.0              # Survey-In Accuracy Limit [m]

    inf:
      all: true                   # Whether to display all INF messages in console
    
    publish:
      all: true
      aid:
        hui: false
      nav:
        posecef: false
